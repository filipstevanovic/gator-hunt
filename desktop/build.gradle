apply plugin: "application"

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = "gatorhunt.desktop.DesktopLauncher"
}

dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// the sprites live in the shared assets/ folder at the project root,
// not under desktop/src/main/resources
sourceSets.main.resources.srcDirs += ["../assets"]

// LWJGL3/GLFW requires macOS to run its event loop on the process's first thread
tasks.named("run", JavaExec) {
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs += "-XstartOnFirstThread"
    }
}
